[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "fchub"
version = "0.1.0"
description = "One interface for classical and foundation-model time series forecasters, plus a small benchmark."
readme = "README.md"
requires-python = ">=3.10"
# Core stays tiny on purpose: each model's heavy deps live in
# src/fchub/models/<model>/requirements.txt and get their own virtualenv.
dependencies = ["numpy>=1.24", "pandas>=2.0"]

[project.optional-dependencies]
dev = ["pytest>=8", "tabulate"]

[tool.hatch.build.targets.wheel]
packages = ["src/fchub"]

[tool.pytest.ini_options]
testpaths = ["tests"]
